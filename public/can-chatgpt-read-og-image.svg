<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Can ChatGPT read my page? Free check of GPTBot, ClaudeBot and PerplexityBot access">
  <defs>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#98f0cc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#98f0cc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#98f0cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#d6b15f" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#d6b15f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fbf8ef" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16201c"/>
      <stop offset="1" stop-color="#0d1311"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#070908"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#gold)"/>

  <g transform="translate(72 64)">
    <g transform="scale(0.6875)">
      <rect x="0" y="0" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="23" y="0" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="46" y="0" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="0" y="23" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="23" y="23" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="46" y="23" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="0" y="46" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="23" y="46" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="46" y="46" width="18" height="18" rx="5" fill="#98f0cc"/>
    </g>
    <text x="60" y="30" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" letter-spacing="-0.4" fill="#fbf8ef">SEO Fix Kit</text>
  </g>

  <text font-family="Inter, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-2.2" fill="url(#headline)">
    <tspan x="72" y="196">Can ChatGPT</tspan>
    <tspan x="72" y="262">read my page?</tspan>
  </text>
  <text font-family="Inter, Arial, sans-serif" font-size="22" fill="#fbf8ef" fill-opacity="0.68">
    <tspan x="72" y="320">Paste a URL. Get the robots.txt answer</tspan>
    <tspan x="72" y="352">and the raw HTML these crawlers receive.</tspan>
  </text>
  <g transform="translate(72 396)" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="1.2">
    <rect width="230" height="40" rx="20" fill="#98f0cc" fill-opacity="0.08" stroke="#98f0cc" stroke-opacity="0.3"/>
    <circle cx="22" cy="20" r="4" fill="#98f0cc"/>
    <text x="36" y="25" fill="#98f0cc">SEOFIXKIT.COM</text>
  </g>
  <text font-family="Inter, Arial, sans-serif" font-size="19" fill="#fbf8ef" fill-opacity="0.6" y="486">
    Free. No account, no email, nothing stored.
  </text>

  <g transform="translate(636 92)">
    <rect width="504" height="446" rx="20" fill="url(#card)" stroke="#fbf8ef" stroke-opacity="0.14"/>
    <rect x="0.5" y="0.5" width="503" height="445" rx="19.5" fill="none" stroke="#98f0cc" stroke-opacity="0.08"/>
    <circle cx="28" cy="28" r="5" fill="#fbf8ef" fill-opacity="0.16"/>
    <circle cx="46" cy="28" r="5" fill="#fbf8ef" fill-opacity="0.16"/>
    <circle cx="64" cy="28" r="5" fill="#fbf8ef" fill-opacity="0.16"/>
    <text x="252" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fbf8ef" fill-opacity="0.5">yourstore.com / pricing</text>
    <path d="M0 56h504" stroke="#fbf8ef" stroke-opacity="0.1"/>

    <g transform="translate(28 84)">
      <rect width="448" height="66" rx="14" fill="#98f0cc" fill-opacity="0.08" stroke="#98f0cc" stroke-opacity="0.32"/>
      <circle cx="34" cy="33" r="14" fill="#98f0cc" fill-opacity="0.16"/>
      <path d="m28 33.5 4.5 4.5 8-9" fill="none" stroke="#98f0cc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="29" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#fbf8ef">Yes, the crawlers can read it</text>
      <text x="62" y="50" font-family="Inter, Arial, sans-serif" font-size="14" fill="#fbf8ef" fill-opacity="0.6">robots.txt allows all three. Content found in the HTML.</text>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">
      <g transform="translate(28 168)">
        <rect width="448" height="58" rx="12" fill="#fbf8ef" fill-opacity="0.04" stroke="#fbf8ef" stroke-opacity="0.08"/>
        <circle cx="30" cy="29" r="11" fill="#98f0cc" fill-opacity="0.14"/>
        <path d="m25 29.5 3.5 3.5 6-7" fill="none" stroke="#98f0cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="35" fill="#fbf8ef">GPTBot</text>
        <text x="420" y="35" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#98f0cc">ALLOWED</text>
      </g>
      <g transform="translate(28 238)">
        <rect width="448" height="58" rx="12" fill="#fbf8ef" fill-opacity="0.04" stroke="#fbf8ef" stroke-opacity="0.08"/>
        <circle cx="30" cy="29" r="11" fill="#98f0cc" fill-opacity="0.14"/>
        <path d="m25 29.5 3.5 3.5 6-7" fill="none" stroke="#98f0cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="35" fill="#fbf8ef">ClaudeBot</text>
        <text x="420" y="35" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#98f0cc">ALLOWED</text>
      </g>
      <g transform="translate(28 308)">
        <rect width="448" height="58" rx="12" fill="#fbf8ef" fill-opacity="0.04" stroke="#fbf8ef" stroke-opacity="0.08"/>
        <circle cx="30" cy="29" r="11" fill="#98f0cc" fill-opacity="0.14"/>
        <path d="m25 29.5 3.5 3.5 6-7" fill="none" stroke="#98f0cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="35" fill="#fbf8ef">PerplexityBot</text>
        <text x="420" y="35" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#98f0cc">ALLOWED</text>
      </g>
    </g>

    <g transform="translate(28 386)">
      <rect width="448" height="42" rx="12" fill="#fbf8ef" fill-opacity="0.03" stroke="#fbf8ef" stroke-opacity="0.06"/>
      <text x="20" y="27" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fbf8ef" fill-opacity="0.62">1,240 words · 3 schema types</text>
      <text x="428" y="27" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#98f0cc">EVIDENCE</text>
    </g>
  </g>
</svg>
