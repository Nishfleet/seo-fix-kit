<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="SEO Fix Kit: SEO fixes you can prove">
  <defs>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#98f0cc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#98f0cc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#98f0cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#d6b15f" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#d6b15f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fbf8ef" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16201c"/>
      <stop offset="1" stop-color="#0d1311"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#070908"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#gold)"/>

  <!-- Brand -->
  <g transform="translate(72 64)">
    <g transform="scale(0.6875)">
      <rect x="0" y="0" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="23" y="0" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="46" y="0" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="0" y="23" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="23" y="23" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="46" y="23" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="0" y="46" width="18" height="18" rx="5" fill="#1f3b31"/>
      <rect x="23" y="46" width="18" height="18" rx="5" fill="#98f0cc"/>
      <rect x="46" y="46" width="18" height="18" rx="5" fill="#1f3b31"/>
    </g>
    <text x="60" y="30" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650" letter-spacing="-0.4" fill="#fbf8ef">SEO Fix Kit</text>
  </g>

  <!-- Headline -->
  <text font-family="Inter, Arial, sans-serif" font-size="68" font-weight="650" letter-spacing="-2.8" fill="url(#headline)">
    <tspan x="72" y="236">SEO fixes</tspan>
    <tspan x="72" y="312">you can prove.</tspan>
  </text>
  <text font-family="Inter, Arial, sans-serif" font-size="23" fill="#fbf8ef" fill-opacity="0.66">
    <tspan x="72" y="378">Real-browser audits, false alarms</tspan>
    <tspan x="72" y="410">filtered, fixes ready to paste.</tspan>
  </text>
  <g transform="translate(72 470)" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="1.2">
    <rect width="194" height="40" rx="20" fill="#98f0cc" fill-opacity="0.08" stroke="#98f0cc" stroke-opacity="0.3"/>
    <circle cx="22" cy="20" r="4" fill="#98f0cc"/>
    <text x="36" y="25" fill="#98f0cc">SEOFIXKIT.COM</text>
  </g>

  <!-- Product card -->
  <g transform="translate(640 92)">
    <rect width="500" height="446" rx="20" fill="url(#card)" stroke="#fbf8ef" stroke-opacity="0.14"/>
    <rect x="0.5" y="0.5" width="499" height="445" rx="19.5" fill="none" stroke="#98f0cc" stroke-opacity="0.08"/>
    <circle cx="28" cy="28" r="5" fill="#fbf8ef" fill-opacity="0.16"/>
    <circle cx="46" cy="28" r="5" fill="#fbf8ef" fill-opacity="0.16"/>
    <circle cx="64" cy="28" r="5" fill="#fbf8ef" fill-opacity="0.16"/>
    <text x="250" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fbf8ef" fill-opacity="0.5">yourstore.com / report</text>
    <path d="M0 56h500" stroke="#fbf8ef" stroke-opacity="0.1"/>

    <!-- Score ring -->
    <g transform="translate(92 152)">
      <circle r="52" fill="none" stroke="#fbf8ef" stroke-opacity="0.1" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#98f0cc" stroke-width="10" stroke-linecap="round" stroke-dasharray="300.6 326.7" transform="rotate(-90)"/>
      <text y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="650" letter-spacing="-1" fill="#fbf8ef">92</text>
    </g>
    <text x="176" y="134" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#fbf8ef">Rendered page checked</text>
    <text x="176" y="164" font-family="Inter, Arial, sans-serif" font-size="16" fill="#fbf8ef" fill-opacity="0.6">3 real problems, 2 false alarms</text>
    <text x="176" y="186" font-family="Inter, Arial, sans-serif" font-size="16" fill="#fbf8ef" fill-opacity="0.6">filtered out before you see them</text>

    <!-- Rows -->
    <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">
      <g transform="translate(28 236)">
        <rect width="444" height="52" rx="12" fill="#fbf8ef" fill-opacity="0.04" stroke="#fbf8ef" stroke-opacity="0.08"/>
        <circle cx="26" cy="26" r="11" fill="#98f0cc" fill-opacity="0.14"/>
        <path d="m21 26.5 3.5 3.5 6-7" fill="none" stroke="#98f0cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="32" fill="#fbf8ef">Missing meta description</text>
        <text x="420" y="32" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#98f0cc">FIX READY</text>
      </g>
      <g transform="translate(28 300)">
        <rect width="444" height="52" rx="12" fill="#fbf8ef" fill-opacity="0.04" stroke="#fbf8ef" stroke-opacity="0.08"/>
        <circle cx="26" cy="26" r="11" fill="#98f0cc" fill-opacity="0.14"/>
        <path d="m21 26.5 3.5 3.5 6-7" fill="none" stroke="#98f0cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="32" fill="#fbf8ef">Broken social share image</text>
        <text x="420" y="32" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#98f0cc">FIX READY</text>
      </g>
      <g transform="translate(28 364)">
        <rect width="444" height="52" rx="12" fill="#d6b15f" fill-opacity="0.06" stroke="#d6b15f" stroke-opacity="0.28"/>
        <circle cx="26" cy="26" r="11" fill="#d6b15f" fill-opacity="0.16"/>
        <path d="M26 20.5v6.5M26 31h.01" stroke="#d6b15f" stroke-width="2.4" stroke-linecap="round"/>
        <text x="50" y="32" fill="#fbf8ef">Canonical points elsewhere</text>
        <text x="420" y="32" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#d6b15f">PROVEN</text>
      </g>
    </g>
  </g>
</svg>
