# Weekly dependency watch. One grouped PR per ecosystem, at most two open at a
# time. Upstream releases are taken 3 days after publish, per the owner's
# 2026-10-22 standing rule; the window is update latency, not a
# malicious-publish quarantine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      # Majors come one per PR, because one breaking major (eslint 10, PR #322)
      # turned the whole weekly group red.
      npm:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-jsx-a11y 6.10.2 accepts eslint 9 at most (npm ERESOLVE on #322).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
