name: Cloudflare analytics probe

on:
  workflow_dispatch: {}
  push:
    branches: [orch/issue-237]

permissions:
  contents: read

concurrency:
  group: cloudflare-analytics-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_SCRIPT: seo-fix-kit
    steps:
      - name: Write the API headers file
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          work="${RUNNER_TEMP:?}/cfprobe"
          mkdir -p "$work"
          {
            printf 'Authorization: Bearer %s\n' "$CF_TOKEN"
            printf 'Accept: application/json\n'
            printf 'Content-Type: application/json\n'
          } > "$work/headers"
          test -s "$work/headers"

      - name: Test the retention window of the scheduled dataset
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/cfprobe"
          gql() {
            local node="$1" filt="$2" fields="$3"
            jq -nc --arg q "{ viewer { accounts(filter: {accountTag: \"$CF_ACCOUNT\"}) { $node(limit: 5000, filter: {$filt}) { $fields } } } }" \
              '{query: $q}' > "$work/q.json"
            curl --fail --silent --show-error --location \
              -H "@$work/headers" --output "$work/r.json" --data @"$work/q.json" \
              https://api.cloudflare.com/client/v4/graphql
            jq -c --arg node "$node" '{errors: [.errors[]?.message], rows: (.data.viewer.accounts[0][$node] | length), first: (.data.viewer.accounts[0][$node] | .[0]), last: (.data.viewer.accounts[0][$node] | .[-1])}' \
              "$work/r.json"
          }
          for w in '2026-09-25T00:00:00Z 2026-10-02T00:00:00Z' '2026-10-02T00:00:00Z 2026-10-09T00:00:00Z' '2026-10-16T17:31:00Z 2026-10-23T17:31:00Z' '2026-10-21T00:00:00Z 2026-10-28T00:00:00Z'; do
            read -r a b <<<"$w"
            printf 'scheduled %s..%s : ' "$a" "$b"
            gql 'workersInvocationsScheduled' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"$a\", datetime_leq: \"$b\"" 'datetime status'
          done
          printf 'adaptive 10-15..10-16 requests : '
          gql 'workersInvocationsAdaptive' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-15T00:00:00Z\", datetime_leq: \"2026-10-16T00:00:00Z\"" 'sum { requests errors } dimensions { datetime }'
          printf 'adaptive 10-27..10-28 requests : '
          gql 'workersInvocationsAdaptive' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-27T00:00:00Z\", datetime_leq: \"2026-10-28T00:00:00Z\"" 'sum { requests errors } dimensions { datetime }'
          for d in 09 10 11 12 13 14 15 16 22 23 27; do
            printf 'adaptive 2026-10-%s by status : ' "$d"
            gql 'workersInvocationsAdaptive' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-${d}T00:00:00Z\", datetime_leq: \"2026-10-${d}T23:59:59Z\"" 'sum { requests errors } dimensions { status }'
          done

      - name: Read the newest scheduled rows with no time filter
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/cfprobe"
          gql() {
            local node="$1" filt="$2" fields="$3"
            jq -nc --arg q "{ viewer { accounts(filter: {accountTag: \"$CF_ACCOUNT\"}) { $node(limit: 5000, filter: {$filt}) { $fields } } } }" \
              '{query: $q}' > "$work/q.json"
            curl --fail --silent --show-error --location \
              -H "@$work/headers" --output "$work/r.json" --data @"$work/q.json" \
              https://api.cloudflare.com/client/v4/graphql
            jq -c --arg node "$node" '{errors: [.errors[]?.message], rows: (.data.viewer.accounts[0][$node] | length), first: (.data.viewer.accounts[0][$node] | .[0]), last: (.data.viewer.accounts[0][$node] | .[-1])}' \
              "$work/r.json"
          }
          printf 'no time filter, production env : '
          gql 'workersInvocationsScheduled' "scriptName: \"$CF_SCRIPT\", environmentName: \"production\"" 'datetime status'
          printf 'geq today only, no leq        : '
          gql 'workersInvocationsScheduled' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-28T00:00:00Z\"" 'datetime status'
          printf 'last week, env production     : '
          gql 'workersInvocationsScheduled' "scriptName: \"$CF_SCRIPT\", environmentName: \"production\", datetime_geq: \"2026-10-21T00:00:00Z\", datetime_leq: \"2026-10-28T00:00:00Z\"" 'datetime status scriptName environmentName'
          printf 'last week, env Production     : '
          gql 'workersInvocationsScheduled' "scriptName: \"$CF_SCRIPT\", environmentName: \"Production\", datetime_geq: \"2026-10-21T00:00:00Z\", datetime_leq: \"2026-10-28T00:00:00Z\"" 'datetime status scriptName environmentName'
          printf 'every workers dataset         : '
          jq -nc '{query: "{ __schema { queryType { fields { name } } } }"}' > "$work/q.json"
          curl --fail --silent --show-error --location \
            -H "@$work/headers" --output "$work/r.json" --data @"$work/q.json" \
            https://api.cloudflare.com/client/v4/graphql
          jq -c '[.data.__schema.queryType.fields[].name | select(startswith("workers"))]' "$work/r.json"
          printf 'adaptive dimensions           : '
          jq -nc --arg q "{ __type(name: \"AccountWorkersInvocationsAdaptive\") { fields { name } } }" '{query: $q}' > "$work/q.json"
          curl --fail --silent --show-error --location \
            -H "@$work/headers" --output "$work/r.json" --data @"$work/q.json" \
            https://api.cloudflare.com/client/v4/graphql
          jq -c '[.data.__type.fields[].name]' "$work/r.json"
          printf 'adaptive usageModel counts    : '
          gql 'workersInvocationsAdaptive' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-28T00:00:00Z\"" 'sum { requests errors } dimensions { datetime status usageModel }'
          printf 'adaptive usageModel 10-15..16  : '
          gql 'workersInvocationsAdaptive' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-15T00:00:00Z\", datetime_leq: \"2026-10-16T00:00:00Z\"" 'sum { requests errors } dimensions { usageModel }'
          printf 'adaptive usageModel today      : '
          gql 'workersInvocationsAdaptive' "scriptName: \"$CF_SCRIPT\", datetime_geq: \"2026-10-28T00:00:00Z\"" 'sum { requests errors } dimensions { usageModel }'

      - name: Read the D1 tables the scheduled run touches
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/cfprobe"
          db="887316c4-ca9d-4068-a7fa-1f530b479437"
          q() {
            jq -nc --arg sql "$1" '{sql: $sql, params: []}' > "$work/q.json"
            curl --fail --silent --show-error --location \
              -H "@$work/headers" --output "$work/r.json" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$db/query" \
              --data @"$work/q.json"
            jq -c '{success: .success, errors: [.errors[]?.message], result: (.result[0].results)}' "$work/r.json"
          }
          printf 'schedules total        : '; q 'SELECT COUNT(*) AS n FROM audit_schedules'
          printf 'last uptime check      : '; q 'SELECT MAX(uptime_checked_at) AS last FROM audit_schedules'
          printf 'schedules checked     : '; q 'SELECT COUNT(*) AS n FROM audit_schedules WHERE uptime_checked_at IS NOT NULL'
          printf 'reports left           : '; q 'SELECT COUNT(*) AS n FROM audit_reports'
          printf 'jobs by status         : '; q 'SELECT status, COUNT(*) AS n, MAX(updated_at) AS newest FROM audit_jobs GROUP BY status'
          printf 'newest job of any kind : '; q 'SELECT MAX(updated_at) AS newest FROM audit_jobs'
          printf 'token counts           : '; q 'SELECT (SELECT COUNT(*) FROM access_tokens) AS tokens, (SELECT COUNT(*) FROM beta_sessions) AS beta, (SELECT COUNT(*) FROM admin_sessions) AS admin'
          printf 'tokens expired by now  : '; q "SELECT COUNT(*) AS n FROM access_tokens WHERE expires_at < '2026-10-28T00:00:00Z'"
          printf 'beta expired by now    : '; q "SELECT COUNT(*) AS n FROM beta_sessions WHERE expires_at < '2026-10-28T00:00:00Z'"
          printf 'admin expired by now   : '; q "SELECT COUNT(*) AS n FROM admin_sessions WHERE expires_at < '2026-10-28T00:00:00Z'"
          printf 'reports expired by now : '; q "SELECT COUNT(*) AS n FROM audit_reports WHERE expires_at IS NOT NULL AND expires_at < '2026-10-28T00:00:00Z'"
          printf 'rate-limit buckets     : '; q 'SELECT COUNT(*) AS n, MIN(updated_at) AS oldest, MAX(updated_at) AS newest FROM audit_usage'
          printf 'newest fix request     : '; q 'SELECT MAX(created_at) AS newest FROM fix_requests'
          printf 'newest waitlist lead   : '; q 'SELECT MAX(created_at) AS newest FROM waitlist_leads'
          printf 'report expiry range    : '; q 'SELECT COUNT(*) AS n, MIN(expires_at) AS soonest, MAX(expires_at) AS latest FROM audit_reports'

      - name: Ask the Cloudflare API about the worker triggers
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/cfprobe"
          get() {
            local path="$1"
            curl --silent --show-error --location \
              -H "@$work/headers" --output "$work/r.json" \
              -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4$path" | tr -d '\n'
            printf ' '
            jq -c '{success, errors: [.errors[]?.message], result: (.result | if type == "array" then .[0:8] else . end)}' "$work/r.json"
          }
          printf 'script schedules       : '; get "/accounts/$CF_ACCOUNT/workers/scripts/$CF_SCRIPT/schedules"
          printf 'script settings        : '; get "/accounts/$CF_ACCOUNT/workers/scripts/$CF_SCRIPT/settings"
          printf 'script subdomain       : '; get "/accounts/$CF_ACCOUNT/workers/scripts/$CF_SCRIPT/subdomain"

      - name: Read every scheduled run since 2026-10-09 in weekly chunks
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:?}/cfprobe"
          fields='datetime scheduledDatetime cron status scriptName environmentName cpuTimeUs'
          : > "$work/all.jsonl"
          chunk() {
            local from="$1" to="$2"
            local filt="scriptName: \"$CF_SCRIPT\", datetime_geq: \"$from\", datetime_leq: \"$to\""
            jq -nc --arg q "{ viewer { accounts(filter: {accountTag: \"$CF_ACCOUNT\"}) { workersInvocationsScheduled(limit: 5000, filter: {$filt}) { $fields } } } }" \
              '{query: $q}' > "$work/q.json"
            curl --fail --silent --show-error --location \
              -H "@$work/headers" --output "$work/r.json" --data @"$work/q.json" \
              https://api.cloudflare.com/client/v4/graphql
            jq -c '{errors: [.errors[]?.message], rows: (.data.viewer.accounts[0].workersInvocationsScheduled | length)}' "$work/r.json"
            jq -c '.data.viewer.accounts[0].workersInvocationsScheduled[]?' "$work/r.json" >> "$work/all.jsonl"
          }
          chunk '2026-10-09T00:00:00Z' '2026-10-16T00:00:00Z'
          chunk '2026-10-16T00:00:00Z' '2026-10-23T00:00:00Z'
          chunk '2026-10-23T00:00:00Z' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'rows collected: '; wc -l < "$work/all.jsonl"
          echo "--- per UTC day ---"
          jq -s -r '
            group_by(.datetime[0:10])
            | map({date: .[0].datetime[0:10], runs: length, failed: (map(select(.status != "success")) | length)})
            | .[] | "\(.date) runs=\(.runs) failed=\(.failed)"
          ' "$work/all.jsonl"
          echo "--- by status ---"
          jq -s -r 'group_by(.status) | map("\(.[0].status)=\(length)") | join(",")' "$work/all.jsonl"
          echo "--- every non-success scheduled run ---"
          jq -c 'select(.status != "success")' "$work/all.jsonl"
