# One workflow: checks on every PR and merge-queue run, deploy on every
# merge to main (Nishfleet/fleet-ops#10935).
# The job names check and Gitleaks are required checks; keep them stable.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Standing rule: nothing reaches main without a green check (0509#2994).
  check:
    # Playwright 1.60 has no browser for ubuntu-latest (26.04), run 41306471560.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sitemap lastmod test reads `git log -L`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: No helper-script dirs (standing no-glue rule)
        run: |
          regrew="$(git ls-files scripts bin tools ops .specify '*.sh')"
          test -z "$regrew" || { echo "::error::Helper-script files regrew:"; echo "$regrew"; exit 1; }
      - run: npm run format:check
      - run: npx playwright install chromium
      - run: npm run check
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Leaked-token incidents: fleet-ops#9578 (Telegram), fleet-ops#8771 (GitHub login).
  Gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git . --redact --exit-code 2 --no-banner

  # Deploy on merge (fleet-ops#8615).
  deploy:
    if: github.event_name == 'push'
    needs: [check, Gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # New D1 migrations go live before the code that needs them.
          command: |
            d1 migrations apply WAITLIST_DB --remote
            deploy
      - run: curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 10 https://seofixkit.com
