# One workflow: checks on every PR and merge-queue run, a Cloudflare preview
# per PR, deploy on every merge to main (Nishfleet/fleet-ops#10935).
# The job name check is a required check; keep it stable.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Standing rule: nothing reaches main without a green check (0509#2994).
  check:
    # Playwright 1.60 has no browser for ubuntu-latest (26.04), run 41306471560.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sitemap lastmod test reads `git log -L`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: No helper-script dirs (standing no-glue rule)
        run: |
          regrew="$(git ls-files scripts bin tools ops .specify '*.sh')"
          test -z "$regrew" || { echo "::error::Helper-script files regrew:"; echo "$regrew"; exit 1; }
      - run: npm run format:check
      - run: npx playwright install chromium
      - run: npm run check
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # zizmor fails the job on any workflow security finding (unpinned action, token
  # persistence, dangerous trigger). Recipe: https://docs.zizmor.sh/integrations/
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # Owner reset 2026-11-01 (fleet-ops#10935): the owner tries every PR on a preview link.
  # Skipped (counts as passed) where Actions gives no secrets: Dependabot and fork PRs.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # GitHub environment url: the PR shows a "View deployment" button that opens the preview.
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # cf, not wrangler, since the project builds for cf (seo-fix-kit#234); same shape as drive's preview job.
      # PR #343 went green with no link ("no active URLs"), so a link is the pass mark.
      - name: Deploy the preview, and fail when Cloudflare gives no link
        id: preview
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx cf previews deploy "pr-$PR" | tee "$RUNNER_TEMP/preview.out"
          url=$(grep -m1 -oE 'https://pr-[0-9]+-[a-z0-9.-]+' "$RUNNER_TEMP/preview.out" || true)
          curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 5 "${url:?Cloudflare made no preview link}"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Deploy on merge (fleet-ops#8615). Deploys with cf, because wrangler refuses a
  # project built for cf (seo-fix-kit#234). Same shape as Nishfleet/drive deploy-production.yml.
  deploy:
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record the serving Worker version, the rollback target
        id: live
        run: |
          vid=$(npx cf workers deployments list --worker seo-fix-kit --per-page 1 --quiet | jq -er '.deployments[0].versions[] | select(.percentage == 100) | .version_id')
          echo "version_id=$vid" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      # New D1 migrations (WAITLIST_DB) go live before the code that needs them.
      - name: Apply D1 migrations
        run: npx cf d1 migrations apply 887316c4-ca9d-4068-a7fa-1f530b479437
      - id: deploy
        run: npx cf deploy --prebuilt --message "$GITHUB_SHA"
      - name: Smoke the production site
        id: smoke
        timeout-minutes: 3
        run: curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 6 https://seofixkit.com
      - name: Roll back to the serving Worker version
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: |
          npx cf workers deployments create --worker seo-fix-kit --strategy percentage \
            --versions "[{\"version_id\":\"$PREVIOUS\",\"percentage\":100}]"
        env:
          PREVIOUS: ${{ steps.live.outputs.version_id }}
