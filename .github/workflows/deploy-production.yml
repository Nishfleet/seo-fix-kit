name: Deploy production
# Deploys main once its PR check run succeeds (GitHub workflow_run), or by hand (fleet-ops#8615).
on:
  workflow_run:
    workflows: [PR check]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same Node major as the PR check gate (.nvmrc), so main deploys
          # on exactly the runtime that was validated.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Apply new D1 migrations before the code that needs them goes live.
      # Already-applied migrations are skipped, so this is a no-op most runs.
      - run: npx wrangler d1 migrations apply WAITLIST_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 10 https://seofixkit.com
