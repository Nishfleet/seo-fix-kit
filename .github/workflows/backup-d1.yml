name: Weekly D1 backup

# The weekly production export that the retired Mac task
# seofixkit-weekly-d1-backup used to run, moved here per
# Nishfleet/fleet-ops#9527. Sunday 03:30 UTC is the slot the old host timer
# pinned, so the cadence does not change with the scheduler. Wrangler is
# banned fleet-wide (global-standing-rules.md, 2026-09-28), so everything
# here is the D1/R2 REST API with the repo's CLOUDFLARE_API_TOKEN secret
# (infra/cloudflare-tokens, key "seo-fix-kit"). The upload and verify steps
# call the R2 object endpoint directly instead of `cf r2 objects
# put/get` because cf 1.0.0-beta.21 percent-encodes the slash in keys
# (d1%2F...), which its own help forbids; `cf r2 objects list` encodes
# the prefix correctly and proves where the object landed.
# ops/RESTORE.md records what this dump is and is not; D1 Time Travel
# stays the primary restore path.

on:
  schedule:
    - cron: "30 3 * * 0" # Sundays 03:30 UTC; GitHub schedules are always UTC
  workflow_dispatch: {} # one-off runs, for example right after merging
  pull_request: {} # PROOF RUN ONLY — not in the deliverable branch

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false # never kill an export mid-flight

jobs:
  backup:
    name: export and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_ID: 887316c4-ca9d-4068-a7fa-1f530b479437 # wrangler.jsonc d1_databases[0]
      BUCKET: seofixkit-backups # the bucket ops/RESTORE.md names
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install the cf CLI
        run: npm install --global --no-audit --no-fund cf@1.0.0-beta.21
      - name: Diagnose the export lifecycle (temporary, proof branch only)
        run: |
          set -euo pipefail
          umask 077
          printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" >"$RUNNER_TEMP/cf-auth"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/export"
          redact() { sed -e 's/"signed_url":"[^"]*"/"signed_url":"REDACTED"/g'; }
          poll() { curl --fail-with-body -sS -X POST "$api" -H @"$RUNNER_TEMP/cf-auth" \
            -H 'content-type: application/json' --data "$1" | redact; }
          printf 'START %s\n' "$(date -u +%H:%M:%S)"
          printf '%s\n' "$(poll '{"output_format":"polling"}')"
          printf 'FIRST-POLL-NO-BOOKMARK %s\n' "$(date -u +%H:%M:%S)"
          first="$(poll '{"output_format":"polling"}')"
          printf '%s\n' "$first"
          bm="$(printf '%s' "$first" | jq -r '.result.at_bookmark // empty')"
          [ -n "$bm" ] || bm="$(printf '%s' "$first" | jq -r '.at_bookmark // empty')"
          printf 'USING-BOOKMARK=%s\n' "$bm"
          for i in $(seq 1 90); do
            body="$(jq -nc --arg b "$bm" '{output_format:"polling",current_bookmark:$b}')"
            r="$(poll "$body")"
            printf 'POLL %s %s %s\n' "$(date -u +%H:%M:%S)" "$i" "$r"
            url="$(printf '%s' "$r" | jq -r '.result.signed_url // empty')"
            if [ -n "$url" ]; then
              curl -fsS -o /tmp/dump-test.sql "$url" && wc -c /tmp/dump-test.sql
              break
            fi
            case "$r" in
              *'"complete"'*|*'"error"'*) break ;;
              *'Not currently exporting'*) printf 'RESTARTING %s\n' "$(date -u +%H:%M:%S)"; poll '{"output_format":"polling"}' ;;
            esac
            sleep 3
          done
          rm -f "$RUNNER_TEMP/cf-auth"
      - name: Export the database and download the dump
        run: |
          set -euo pipefail
          umask 077
          # The token must never reach argv: curl reads the header from a
          # 0600 file, not from the command line.
          printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" >"$RUNNER_TEMP/cf-auth"
          dump="$RUNNER_TEMP/seofixkit-backup-$(date -u +%Y-%m-%d).sql"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/export"
          started="$(curl --fail-with-body -sS -X POST "$api" \
            -H @"$RUNNER_TEMP/cf-auth" -H 'content-type: application/json' \
            --data '{"output_format":"polling"}')" \
            || { printf 'export request failed: %s\n' "$started" >&2; exit 1; }
          bookmark="$(printf '%s' "$started" | jq -er '.result.at_bookmark')"
          signed_url=""
          for _ in $(seq 1 60); do
            status="$(curl --fail-with-body -sS -X POST "$api" \
              -H @"$RUNNER_TEMP/cf-auth" -H 'content-type: application/json' \
              --data "$(jq -nc --arg bookmark "$bookmark" '{output_format:"polling",current_bookmark:$bookmark}')")" \
              || { printf 'poll request failed: %s\n' "$status" >&2; exit 1; }
            signed_url="$(printf '%s' "$status" | jq -r '.result.signed_url // empty')"
            if [ -n "$signed_url" ]; then break; fi
            sleep 5
          done
          if [ -z "$signed_url" ]; then
            printf 'export never became ready: %s\n' "$status" >&2
            exit 1
          fi
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 -o "$dump" "$signed_url"
          test -s "$dump"
          printf 'DUMP_PATH=%s\n' "$dump" >>"$GITHUB_ENV"
          wc -c "$dump"
      - name: Upload the dump to R2
        run: |
          set -euo pipefail
          object_key="d1/$(basename "$DUMP_PATH")"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            -X PUT "$base/$object_key" \
            -H @"$RUNNER_TEMP/cf-auth" \
            -H 'content-type: application/sql' \
            --data-binary @"$DUMP_PATH" >/dev/null
      - name: Verify the object landed under the exact key
        run: |
          set -euo pipefail
          object_key="d1/$(basename "$DUMP_PATH")"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            "$base/$object_key" \
            -H @"$RUNNER_TEMP/cf-auth" -o "$RUNNER_TEMP/round-trip.sql"
          cmp "$DUMP_PATH" "$RUNNER_TEMP/round-trip.sql"
          cf r2 objects list --bucket-name "$BUCKET" --prefix "$object_key" \
            | grep -F "$object_key"
          printf 'round-trip verified: %s bytes at %s\n' "$(wc -c <"$DUMP_PATH")" "$object_key"
          rm -f "$DUMP_PATH" "$RUNNER_TEMP/round-trip.sql" "$RUNNER_TEMP/cf-auth" # the dump holds customer rows
